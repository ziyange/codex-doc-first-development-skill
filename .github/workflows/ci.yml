name: CI Workflow

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is unavailable on newer Ubuntu images and macOS arm64.
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
        python-version: ['3.9', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests (unittest)
      run: |
        python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ruff
      run: pip install ruff

    - name: Lint (ruff)
      run: ruff check .

  docs-selfcheck:
    # Dogfooding: the repository's own governance gates must stay green.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Markdown link and anchor check (GFM)
      run: |
        python codex-doc-first-development/scripts/check_docs_links.py . --json

    - name: Task Pack gate on fixtures
      run: |
        python codex-doc-first-development/scripts/check_task_pack.py tests/fixtures/valid_task_pack.md --json

    - name: End-to-end runtime hard gate on fixtures
      run: |
        python codex-doc-first-development/scripts/verify_runtime_trace.py --trace tests/fixtures/valid_trace.json --permission-log tests/fixtures/valid_audit.log --task-pack tests/fixtures/valid_task_pack.md --schemas codex-doc-first-development/references/schemas.md --mode goal --next-iteration 1 --json
